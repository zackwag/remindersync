name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build and sign ReminderSync.app
        run: scripts/build-app.sh -v "${GITHUB_REF_NAME#v}" -s "Developer ID Application" -o "$RUNNER_TEMP/export"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd "$RUNNER_TEMP/export"
          ditto -c -k --keepParent ReminderSync.app ReminderSync.zip

          SUBMIT_OUTPUT=$(xcrun notarytool submit ReminderSync.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1) || true
          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')

          if ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi

          xcrun stapler staple ReminderSync.app

      - name: Package for release
        run: |
          cd "$RUNNER_TEMP/export"
          rm ReminderSync.zip
          ditto -c -k --keepParent ReminderSync.app ReminderSync.zip

      - name: Attach app to the release-please-created release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              break
            fi
            echo "Release for ${{ github.ref_name }} not found yet, retrying ($i)..."
            sleep 5
          done
          gh release upload "${{ github.ref_name }}" "${{ runner.temp }}/export/ReminderSync.zip" --clobber

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "$RUNNER_TEMP/export/ReminderSync.zip" | awk '{print $1}')
          BRANCH="update-remindersync-${VERSION}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/zackwag/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          git checkout -b "$BRANCH"

          cat > Casks/remindersync.rb << EOF
          cask "remindersync" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/zackwag/remindersync/releases/download/v#{version}/ReminderSync.zip"
            name "ReminderSync"
            desc "Sync Apple Reminders lists with Skylight lists and chores"
            homepage "https://github.com/zackwag/remindersync"

            depends_on macos: :sonoma

            app "ReminderSync.app"
            binary "#{appdir}/ReminderSync.app/Contents/MacOS/remindersync"

            uninstall launchctl: "com.zackwag.remindersync",
                      delete:    "~/Library/LaunchAgents/com.zackwag.remindersync.plist"

            zap trash: [
              "~/Library/Application Support/remindersync",
              "~/Library/Logs/remindersync",
            ]

            caveats <<~EOS
              Set up a sync pair, then run the daemon in the background:
                remindersync config
                remindersync install
            EOS
          end
          EOF
          sed -i '' 's/^          //' Casks/remindersync.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/remindersync.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(remindersync): update to ${VERSION}"
          git push origin "$BRANCH"

          export GH_TOKEN="$TAP_TOKEN"
          gh pr create --repo zackwag/homebrew-tap --base main --head "$BRANCH" \
            --title "chore(remindersync): update to ${VERSION}" \
            --body "Automated update from a remindersync release."

          pr_number=$(gh pr list --repo zackwag/homebrew-tap --head "$BRANCH" --json number -q '.[0].number')
          sleep 20
          for i in $(seq 1 40); do
            total=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '.statusCheckRollup | length')
            pending=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '[.statusCheckRollup[] | select(.status!="COMPLETED")] | length')
            if [ "$total" != "0" ] && [ "$pending" = "0" ]; then break; fi
            echo "Waiting for tap checks ($i)..."
            sleep 15
          done

          bad=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '[.statusCheckRollup[] | select((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not)] | length')
          if [ "$bad" != "0" ]; then
            echo "::error::$bad check(s) did not succeed; leaving PR #$pr_number open for review."
            exit 1
          fi

          gh pr merge "$pr_number" --repo zackwag/homebrew-tap --squash --delete-branch
